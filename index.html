<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#c41230" />
<title>Inbound Load Tracker</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-title">
    <h1>Inbound Loads</h1>
    <div class="topbar-subline">
      <span id="userGreeting" class="user-greeting hidden"></span>
      <span id="lastUpdated" class="last-updated">—</span>
      <button id="weatherPill" class="weather-pill hidden" title="Fort Smith, AR"></button>
      <button id="notifyChip" class="weather-pill" title="Toggle overdue-load alerts">🔔 Alerts: Off</button>
    </div>
  </div>
  <div class="topbar-actions">
    <button id="adminBtn" class="icon-btn hidden" title="Admin" aria-label="Admin">
      <svg viewBox="0 0 24 24" width="19" height="19"><path fill="currentColor" d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5zm0 4.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM12 13c2 0 4.5 1 4.5 3v1h-9v-1c0-2 2.5-3 4.5-3z"/></svg>
    </button>
    <button id="userBtn" class="icon-btn" title="Switch user" aria-label="Switch user">
      <svg viewBox="0 0 24 24" width="19" height="19"><path fill="currentColor" d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4 0-8 2-8 5v2h16v-2c0-3-4-5-8-5z"/></svg>
    </button>
    <button id="searchBtn" class="icon-btn" title="Search" aria-label="Search">
      <svg viewBox="0 0 24 24" width="19" height="19"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    </button>
    <button id="refreshBtn" class="icon-btn" title="Refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" width="19" height="19"><path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6a5.96 5.96 0 0 1 4.24 1.76L13 11h7V4z"/></svg>
    </button>
    <button id="reportBtn" class="icon-btn" title="Email report" aria-label="Send report">
      <svg viewBox="0 0 24 24" width="19" height="19"><path fill="currentColor" d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5z"/></svg>
    </button>
  </div>
</header>

<nav class="tabs" id="locationTabs">
  <!-- location buttons injected here -->
</nav>

<div class="date-bar" id="dateBar">
  <div class="date-chips" id="dateChips">
    <!-- Yesterday / Today / Tomorrow / All chips injected here -->
  </div>
  <div class="date-picker-wrap">
    <input type="date" id="datePicker" class="date-picker" aria-label="Pick a date" />
  </div>
</div>

<div class="progress-bar" id="progressBar"></div>

<main id="loadList" class="load-list">
  <div class="empty-state" id="emptyState">Loading…</div>
</main>

<div id="detailSheet" class="sheet-overlay hidden">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div id="sheetContent"></div>
    <button class="sheet-close" id="sheetCloseBtn">Close</button>
  </div>
</div>

<!-- Search sheet -->
<div id="searchSheet" class="sheet-overlay hidden">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>Search Loads</h2>
    <p class="sheet-hint">Look up any BOL or carrier, any day.</p>
    <input id="searchInput" class="modal-like-input" type="text" placeholder="BOL number or carrier name…" autocomplete="off" />
    <div id="searchResults" class="search-results"></div>
    <button class="sheet-close" id="searchCloseBtn">Close</button>
  </div>
</div>

<!-- Admin sheet: Activity history + Staff roster (admin role only) -->
<div id="adminSheet" class="sheet-overlay hidden">
  <div class="sheet admin-sheet">
    <div class="sheet-handle"></div>
    <div class="admin-tabs">
      <button id="adminTabActivity" class="admin-tab active">Activity</button>
      <button id="adminTabStaff" class="admin-tab">Staff</button>
    </div>

    <div id="adminActivityView">
      <div class="date-chips" id="adminDateChips"></div>
      <div id="adminHistoryList" class="search-results"></div>
    </div>

    <div id="adminStaffView" class="hidden">
      <div id="staffList" class="search-results"></div>
      <button id="addStaffBtn" class="btn btn-primary add-staff-btn">+ Add Staff</button>
    </div>

    <button class="sheet-close" id="adminCloseBtn">Close</button>
  </div>
</div>

<!-- Add/edit staff modal -->
<div id="staffModal" class="modal-overlay hidden">
  <div class="modal">
    <h3 id="staffModalTitle">Add Staff</h3>
    <input id="staffNameInput" type="text" placeholder="Name" autocomplete="off" />
    <input id="staffPinInput" type="text" inputmode="numeric" placeholder="4-8 digit PIN" autocomplete="off" />
    <label class="staff-role-toggle">
      <input type="checkbox" id="staffAdminCheckbox" /> Admin access
    </label>
    <label class="staff-role-toggle">
      <input type="checkbox" id="staffActiveCheckbox" checked /> Active (unchecking disables their PIN)
    </label>
    <div id="staffModalError" class="modal-error hidden"></div>
    <div class="modal-actions">
      <button id="staffCancelBtn" class="btn btn-secondary">Cancel</button>
      <button id="staffSaveBtn" class="btn btn-primary">Save</button>
    </div>
  </div>
</div>

<!-- Sign-in modal (PIN only — the server tells us who it belongs to) -->
<div id="signInModal" class="modal-overlay hidden">
  <div class="modal">
    <h3 id="signInTitle">Enter your PIN</h3>
    <input id="signInPinInput" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off" />
    <div id="signInError" class="modal-error hidden"></div>
    <div class="modal-actions">
      <button id="signInCancel" class="btn btn-secondary">Cancel</button>
      <button id="signInConfirm" class="btn btn-primary">Sign In</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
