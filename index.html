<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#c41230" />
<title>Inbound Load Tracker</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-title">
    <h1>Inbound Loads</h1>
    <div class="topbar-subline">
      <span id="userGreeting" class="user-greeting hidden"></span>
      <span id="lastUpdated" class="last-updated">—</span>
      <button id="weatherPill" class="weather-pill hidden" title="Fort Smith, AR"></button>
    </div>
  </div>
  <div class="topbar-actions">
    <button id="userBtn" class="icon-btn" title="Your name" aria-label="Your name">
      <svg viewBox="0 0 24 24" width="19" height="19"><path fill="currentColor" d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4 0-8 2-8 5v2h16v-2c0-3-4-5-8-5z"/></svg>
    </button>
    <button id="searchBtn" class="icon-btn" title="Search" aria-label="Search">
      <svg viewBox="0 0 24 24" width="19" height="19"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    </button>
    <button id="refreshBtn" class="icon-btn" title="Refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" width="19" height="19"><path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6a5.96 5.96 0 0 1 4.24 1.76L13 11h7V4z"/></svg>
    </button>
    <button id="reportBtn" class="icon-btn" title="Email report" aria-label="Send report">
      <svg viewBox="0 0 24 24" width="19" height="19"><path fill="currentColor" d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5z"/></svg>
    </button>
  </div>
</header>

<nav class="tabs" id="locationTabs">
  <!-- location buttons injected here -->
</nav>

<main id="loadList" class="load-list">
  <div class="empty-state" id="emptyState">Loading…</div>
</main>

<div id="detailSheet" class="sheet-overlay hidden">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div id="sheetContent"></div>
    <button class="sheet-close" id="sheetCloseBtn">Close</button>
  </div>
</div>

<!-- Search sheet -->
<div id="searchSheet" class="sheet-overlay hidden">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>Search Loads</h2>
    <p class="sheet-hint">Look up any BOL or carrier, any day.</p>
    <input id="searchInput" class="modal-like-input" type="text" placeholder="BOL number or carrier name…" autocomplete="off" />
    <div id="searchResults" class="search-results"></div>
    <button class="sheet-close" id="searchCloseBtn">Close</button>
  </div>
</div>

<!-- Sign-in modal: also doubles as "change name" -->
<div id="signInModal" class="modal-overlay hidden">
  <div class="modal">
    <h3 id="signInTitle">Sign in</h3>
    <input id="nameInput" type="text" placeholder="Your name" autocomplete="off" />
    <input id="signInPasscodeInput" type="password" inputmode="numeric" placeholder="Passcode" autocomplete="off" />
    <div id="signInError" class="modal-error hidden"></div>
    <div class="modal-actions">
      <button id="signInCancel" class="btn btn-secondary">Cancel</button>
      <button id="signInConfirm" class="btn btn-primary">Save</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
